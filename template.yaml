# template.yaml – AI News Pipeline with environment parameters for Lambda

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lambda deployment for AI Research Poster Pipeline

Parameters:
  S3OutputBucket:
    Type: String
    Description: S3 bucket used for storing output data

  ScraperOutputPrefix:
    Type: String
    Default: ai-research-pipeline/output/scraper/
    Description: Prefix for scraper output

  SummarizerOutputPrefix:
    Type: String
    Default: ai-research-pipeline/output/summarizer/
    Description: Prefix for summarizer output

  PosterOutputPrefix:
    Type: String
    Default: ai-research-pipeline/output/poster/
    Description: Prefix for poster output

  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model (or cross-region inference profile) to use for summarization

  FinalSummarizedFile:
    Type: String
    Default: final_summarized.json
    Description: Name of the reassembled summary output file

  MemoryOutputPrefix:
    Type: String
    Default: ai-research-pipeline/output/memory/
    Description: Prefix for memory output

  MemoryOutputFile:
    Type: String
    Default: article_memory.json
    Description: Key for memory output file (legacy seen-library; dedup now uses the posted ledger)

  PostedLedgerFile:
    Type: String
    Default: posted_library.json
    Description: Ledger of actually-posted articles (written by poster, read by scraper for dedup)

  MakeWebhookUrl:
    Type: String
    Default: ""
    NoEcho: true
    Description: Make.com webhook for Slack alerts (empty = code fallback URL; set after rotating)

  AlertEmail:
    Type: String
    Default: no0krypto@gmail.com
    Description: Email for pipeline failure alerts (SNS subscription requires one-time confirmation)

  ScoredOutputPrefix:
    Type: String
    Default: ai-research-pipeline/output/scored/
    Description: Prefix for the scored-candidates sidecar (never scanned by chunker/poster)

  BuzzEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Kill switch for Phase 1.5 buzz enrichment (no redeploy of code needed).

  BedrockWriterModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-6
    Description: Bedrock model for thread writing (Sonnet-tier); scoring stays on BedrockModelId.

Globals:
  Function:
    Timeout: 600
    Runtime: python3.12
    MemorySize: 512

Resources:

  CommonUtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: common-utils
      Description: Shared utility code for all AI pipeline Lambdas
      ContentUri: lambda/layers/common
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Retain

  PipelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-research-pipeline
      Timeout: 900  # must outlive the summarizer stage (up to 600s) + scraper + poster
      Handler: pipeline_lambda.handler
      CodeUri: lambda/pipeline/
      Layers:
        - !Ref CommonUtilsLayer
      Description: Full pipeline controller of scraper → summarizer → poster
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource:
                - !GetAtt ScraperFunction.Arn
                - !GetAtt SummarizerMainFunction.Arn
                - !GetAtt PosterFunction.Arn
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref AlertTopic
      Environment:
        Variables:
          S3_OUTPUT_BUCKET: !Ref S3OutputBucket
          SCRAPER_FUNCTION_NAME: !Ref ScraperFunction
          SUMMARIZER_MAIN_FUNCTION_NAME: !Ref SummarizerMainFunction
          POSTER_FUNCTION_NAME: !Ref PosterFunction
          MAKE_WEBHOOK_URL: !Ref MakeWebhookUrl
          ALERT_TOPIC_ARN: !Ref AlertTopic

  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-research-scraper
      Handler: scraper_lambda.handler
      CodeUri: lambda/scraper/
      Layers:
        - !Ref CommonUtilsLayer
      Description: Scrapes articles
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${S3OutputBucket}
                - !Sub arn:aws:s3:::${S3OutputBucket}/${ScraperOutputPrefix}*
                - !Sub arn:aws:s3:::${S3OutputBucket}/${MemoryOutputPrefix}*
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - arn:aws:bedrock:*::foundation-model/anthropic.*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*.anthropic.*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${S3OutputBucket}/${ScoredOutputPrefix}*
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: !Ref AlertTopic
      Environment:
        Variables:
          S3_OUTPUT_BUCKET: !Ref S3OutputBucket
          SCRAPER_OUTPUT_PREFIX: !Ref ScraperOutputPrefix
          MEMORY_OUTPUT_PREFIX: !Ref MemoryOutputPrefix
          MEMORY_OUTPUT_FILE: !Ref MemoryOutputFile
          POSTED_LEDGER_FILE: !Ref PostedLedgerFile
          MAKE_WEBHOOK_URL: !Ref MakeWebhookUrl
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          SCORED_OUTPUT_PREFIX: !Ref ScoredOutputPrefix
          ALERT_TOPIC_ARN: !Ref AlertTopic
          BUZZ_ENABLED: !Ref BuzzEnabled
          SCORING_W_BUZZ: "0.125"
          BUZZ_HTTP_TIMEOUT_S: "3"
          BUZZ_WALL_BUDGET_S: "20"
          SCORING_W_RELEVANCE: "0.5"
          SCORING_W_NOVELTY: "0.25"
          SCORING_W_HOOK: "0.25"
          SCORING_MAX_CANDIDATES: "40"

  SummarizerMainFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-research-summarizer-main
      Handler: summarizer_main_lambda.handler
      CodeUri: lambda/summarizer/
      Layers:
        - !Ref CommonUtilsLayer
      Description: Controller for chunking and summarization of scraped data in parallel (run this, not summarizer)
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
                - s3:PutObject
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${S3OutputBucket}
                - !Sub arn:aws:s3:::${S3OutputBucket}/${ScraperOutputPrefix}*
                - !Sub arn:aws:s3:::${S3OutputBucket}/${SummarizerOutputPrefix}*
                - !GetAtt SummarizerFunction.Arn  # Needed for invoking summarizer within main controller
      Environment:
        Variables:
          S3_OUTPUT_BUCKET: !Ref S3OutputBucket
          SCRAPER_OUTPUT_PREFIX: !Ref ScraperOutputPrefix
          SUMMARIZER_OUTPUT_PREFIX: !Ref SummarizerOutputPrefix
          SUMMARIZER_FUNCTION_NAME: !Ref SummarizerFunction


  SummarizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-research-summarizer
      Handler: summarizer_lambda.handler
      CodeUri: lambda/summarizer/
      Layers:
        - !Ref CommonUtilsLayer
      Description: Summarizes articles using Bedrock & FMs
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:ListFoundationModels
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                # Wildcards (scoped to Anthropic models) instead of a pinned model ARN:
                # a BedrockModelId change must never outrun this policy again.
                # Cross-region inference profiles (us.anthropic.*) need invoke on the
                # profile AND the underlying foundation models in the routed regions.
                - arn:aws:bedrock:*::foundation-model/anthropic.*
                - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*.anthropic.*
                - !Sub arn:aws:s3:::${S3OutputBucket}
                - !Sub arn:aws:s3:::${S3OutputBucket}/${ScraperOutputPrefix}*
                - !Sub arn:aws:s3:::${S3OutputBucket}/${SummarizerOutputPrefix}*
      Environment:
        Variables:
          S3_OUTPUT_BUCKET: !Ref S3OutputBucket
          SCRAPER_OUTPUT_PREFIX: !Ref ScraperOutputPrefix
          SUMMARIZER_OUTPUT_PREFIX: !Ref SummarizerOutputPrefix
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_WRITER_MODEL_ID: !Ref BedrockWriterModelId
          THREAD_MAX_TWEETS: "5"

  PosterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-research-poster
      Handler: poster_lambda.handler
      CodeUri: lambda/poster/
      Description: Posts summaries to Twitter as threads
      Layers:
        - !Ref CommonUtilsLayer
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:secretsmanager:us-east-1:894495940143:secret:TwitterAPICreds-n5vtOF
                - !Sub arn:aws:s3:::${S3OutputBucket}
                - !Sub arn:aws:s3:::${S3OutputBucket}/${SummarizerOutputPrefix}*
                - !Sub arn:aws:s3:::${S3OutputBucket}/${MemoryOutputPrefix}*
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${S3OutputBucket}/${MemoryOutputPrefix}*
      Environment:
        Variables:
          S3_OUTPUT_BUCKET: !Ref S3OutputBucket
          SUMMARY_OUTPUT_PREFIX: !Ref SummarizerOutputPrefix
          SUMMARIZED_FILE: !Ref FinalSummarizedFile
          MEMORY_OUTPUT_PREFIX: !Ref MemoryOutputPrefix
          POSTED_LEDGER_FILE: !Ref PostedLedgerFile
          MAX_SUMMARY_AGE_HOURS: "6"
          MAKE_WEBHOOK_URL: !Ref MakeWebhookUrl

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ai-research-pipeline-alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Backstop for hard crashes/timeouts (graceful aborts publish to SNS directly)
  PipelineErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ai-research-pipeline-errors
      AlarmDescription: Pipeline Lambda crashed or timed out
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PipelineFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  PosterErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ai-research-poster-errors
      AlarmDescription: Poster Lambda crashed or timed out
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PosterFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  # Dead-schedule detector: no pipeline invocation for 4 consecutive days
  # (covers the Fri→Mon weekend gap of the weekday schedule).
  PipelineHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ai-research-pipeline-heartbeat
      AlarmDescription: Pipeline has not run for 4 days — schedule is dead or disabled
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref PipelineFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 4
      DatapointsToAlarm: 4
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlertTopic

  PipelineSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: pipeline-daily-run
      ScheduleExpression: cron(0 16 ? * MON-FRI *) # Once daily on weekdays, 16:00 UTC (noon ET) — arXiv announces Mon-Fri
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt PipelineFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        Input: !Sub |
          {
            "scrape_limit": 10,
            "max_new_articles": 1,
            "chunk_size": 1,
            "skip_memory": false,
            "dry_run": false
          }
        RetryPolicy:
          MaximumRetryAttempts: 0

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SchedulerInvokeRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowLambdaInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PipelineFunction.Arn      

Outputs:
  SummarizerMainOutput:
    Description: Summarizer Main Lambda Function ARN
    Value: !GetAtt SummarizerMainFunction.Arn
  PosterOutput:
    Description: Poster Lambda Function ARN
    Value: !GetAtt PosterFunction.Arn
  SummarizerOutput:
    Description: Summarizer Lambda Function ARN
    Value: !GetAtt SummarizerFunction.Arn
  ScraperOutput:
    Description: Scraper Lambda Function ARN
    Value: !GetAtt ScraperFunction.Arn
