[project]
name = "ai-news-pipeline"
version = "0.12.0"
description = "arXiv → Bedrock (Claude) → Twitter/X research pipeline on AWS SAM"
requires-python = ">=3.12"
# Dev-environment dependencies (Lambda packaging still uses each function's
# requirements.txt via `sam build`). Keep the two in sync when bumping.
dependencies = [
    "boto3>=1.35",
    "requests>=2.32",
    "tweepy>=4.15",
    "python-dotenv>=1.1",
    "beautifulsoup4>=4.13",
    "pandas>=2.2",
]

[tool.uv]
package = false
